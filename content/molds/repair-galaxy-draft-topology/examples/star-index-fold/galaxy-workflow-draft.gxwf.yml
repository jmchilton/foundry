class: GalaxyWorkflowDraft
id: rnaseq_alignment
label: RNA-seq alignment against a built genome index
doc: Build a STAR genome index from a history genome and align paired and single-end reads against it.
inputs:
  - id: reads_paired
    label: Paired reads
    type: collection
    collection_type: list:paired
    format:
      - fastqsanger.gz
  - id: reads_single
    label: Single-end reads
    type: collection
    collection_type: list
    format:
      - fastqsanger.gz
  - id: genome
    label: Genome FASTA
    type: data
    format:
      - fasta
outputs:
  - id: bam_paired
    label: Paired alignments
    outputSource: star_paired/mapped_reads
  - id: bam_single
    label: Single-end alignments
    outputSource: star_single/mapped_reads
steps:
  star_genome_index:
    id: star_genome_index
    label: STAR genome index
    type: tool
    tool_id: TODO
    tool_version: TODO
    in:
      - id: TODO_genome
        source: genome
    out:
      - id: TODO_index
    _plan_state: Build the index without a GTF.
    _plan_context: "Source command: STAR --runMode genomeGenerate --genomeFastaFiles genome.fa."
    _plan_out: TODO_index is the genome index both alignment steps read.
  star_paired:
    id: star_paired
    label: STAR paired-end
    type: tool
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/rgrnastar/rna_star/2.7.11b+galaxy1
    tool_version: TODO
    in:
      - id: singlePaired|input
        source: reads_paired
      - id: TODO_index
        source: star_genome_index/TODO_index
    out:
      - id: mapped_reads
    _plan_state: Paired collection, aligned against the index from star_genome_index, without a GTF.
  star_single:
    id: star_single
    label: STAR single-end
    type: tool
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/rgrnastar/rna_star/2.7.11b+galaxy1
    tool_version: TODO
    in:
      - id: singlePaired|input1
        source: reads_single
      - id: TODO_index
        source: star_genome_index/TODO_index
    out:
      - id: mapped_reads
    _plan_state: Single-end collection, aligned against the index from star_genome_index, without a GTF.
